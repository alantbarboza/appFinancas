[versions]
agp = "9.3.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
room = "2.6.1"
navigation = "2.7.7"
biometric = "1.1.0"
documentfile = "1.1.0"
